name: Atualizar busca e codigo

on: [push, workflow_dispatch]

permissions:
  contents: write

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Aplicar alteracoes
        run: echo '' | base64 -d > /tmp/patch.py && python3 /tmp/patch.py
      - name: Salvar alteracao
        run: git config user.name 'github-actions[bot]' && git config user.email '41898282+github-actions[bot]@users.noreply.github.com' && git add index.html && git diff --cached --quiet || git commit -m 'Amplia fontes de busca e mostra codigo lido'; git push
