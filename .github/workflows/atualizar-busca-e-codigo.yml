name: Melhorar busca de produtos

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Corrigir busca e codigo lido
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          # CSS do codigo lido
          css = '''\n  .codigo-lido { margin: -4px 0 18px; padding: 10px 12px; border: 1px solid var(--cor-borda); border-radius: 10px; background: var(--cor-fundo); text-align: center; font-size: .84rem; color: var(--cor-texto-secundario); }\n  .codigo-lido strong { color: var(--cor-texto); font-size: .95rem; letter-spacing: .5px; }\n'''
          if '.codigo-lido {' not in s:
              s = s.replace('</style>', css + '</style>', 1)

          # Elemento visivel para o codigo detectado
          alvo = '      <input type="hidden" id="form-codigo">'
          novo = '''      <div id="codigo-lido" class="codigo-lido oculto">Código lido: <strong id="codigo-lido-valor"></strong></div>\n      <input type="hidden" id="form-codigo">'''
          if alvo in s and 'id="codigo-lido-valor"' not in s:
              s = s.replace(alvo, novo, 1)

          # Busca ampliada, com fonte especializada em medicamentos brasileiros.
          inicio = s.find('  async function buscarProdutoAPI(codigo) {')
          fim = s.find('  function preencherFormulario(codigo, produto) {', inicio)
          if inicio < 0 or fim < 0:
              raise SystemExit('Nao encontrei as funcoes esperadas no index.html')

          func = r'''  async function buscarProdutoAPI(codigo) {
    const campos = 'product_name,product_name_pt,product_name_en,brands,image_front_small_url';

    const normalizar = (p) => {
      if (!p) return null;
      const nome = p.product_name_pt || p.product_name || p.product_name_en || p.title || p.nome || p.name;
      if (!nome) return null;
      return {
        nome: String(nome).trim(),
        marca: p.brands || p.brand || p.marca || p.laboratorio || '',
        imagem: p.image_front_small_url || p.image_url || p.imagem_url || (Array.isArray(p.images) ? p.images[0] : null) || null
      };
    };

    const tentarJson = async (url, transformar) => {
      try {
        const res = await fetch(url, { headers: { 'Accept': 'application/json' } });
        if (!res.ok) return null;
        const data = await res.json();
        return transformar(data);
      } catch (e) { return null; }
    };

    // 1) Catalogo brasileiro amplo (inclui farmacia/higiene).
    let achado = await tentarJson(
      `https://dotcompany.com.br/api/catalogo/public/buscar?q=${encodeURIComponent(codigo)}`,
      data => normalizar(data && data.produto)
    );
    if (achado) return achado;

    // 2) Base especializada em medicamentos brasileiros, cruzada com ANVISA/CMED.
    // Se o servidor permitir CORS, o titulo da pagina EAN fornece o nome mesmo quando
    // as bases de varejo nao possuem o codigo.
    try {
      const res = await fetch(`https://dadosmedicamentos.com.br/ean/${encodeURIComponent(codigo)}`);
      if (res.ok) {
        const html = await res.text();
        const m = html.match(/<title[^>]*>\s*EAN\s+[^<]+?\s*[—-]\s*([^<]+?)\s*<\/title>/i);
        if (m && m[1]) {
          let nome = m[1].replace(/\s+/g, ' ').trim();
          const marca = nome.match(/\(([^()]+)\)\s*$/);
          if (marca) nome = nome.replace(/\s*\([^()]+\)\s*$/, '').trim();
          if (nome) return { nome, marca: marca ? marca[1] : '', imagem: null };
        }
      }
    } catch (e) {}

    // 3) Open Food Facts universal: food, beauty, pet food e products.
    achado = await tentarJson(
      `https://world.openfoodfacts.org/api/v3/product/${encodeURIComponent(codigo)}?product_type=all&cc=br&lc=pt&fields=${campos}`,
      data => normalizar(data && data.product)
    );
    if (achado) return achado;

    // 4) Bases Open*Facts diretamente.
    for (const base of [
      'https://world.openfoodfacts.org',
      'https://world.openbeautyfacts.org',
      'https://world.openpetfoodfacts.org',
      'https://world.openproductsfacts.org'
    ]) {
      achado = await tentarJson(
        `${base}/api/v2/product/${encodeURIComponent(codigo)}.json?fields=${campos}`,
        data => data && data.status === 1 ? normalizar(data.product) : null
      );
      if (achado) return achado;
    }

    // 5) UPC/EAN global adicional.
    achado = await tentarJson(
      `https://api.upcitemdb.com/prod/trial/lookup?upc=${encodeURIComponent(codigo)}`,
      data => normalizar(data && data.items && data.items[0])
    );
    if (achado) return achado;

    // 6) Alguns produtos conhecidos que nao aparecem nas bases publicas.
    const locais = {
      '7897042016297': { nome: 'Loção Hidratante Corporal Skalinha Bebê Lavanda 200 ml', marca: 'Skala', imagem: null }
    };
    return locais[codigo] || null;
  }

'''
          s = s[:inicio] + func + s[fim:]

          # Sempre mostra o codigo lido quando houver codigo.
          old = '''  function preencherFormulario(codigo, produto) {\n    document.getElementById('form-codigo').value = codigo;'''
          new = '''  function preencherFormulario(codigo, produto) {\n    const codigoEl = document.getElementById('codigo-lido');\n    const codigoValorEl = document.getElementById('codigo-lido-valor');\n    if (codigoEl && codigoValorEl) {\n      if (codigo) {\n        codigoValorEl.textContent = codigo;\n        codigoEl.classList.remove('oculto');\n      } else {\n        codigoValorEl.textContent = '';\n        codigoEl.classList.add('oculto');\n      }\n    }\n    document.getElementById('form-codigo').value = codigo;'''
          if old not in s:
              raise SystemExit('preencherFormulario nao encontrada')
          s = s.replace(old, new, 1)

          p.write_text(s, encoding='utf-8')
          PY

      - name: Salvar alteracao
        run: |
          if git diff --quiet -- index.html; then
            echo 'Nenhuma alteracao necessaria.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Corrige codigo lido e melhora produtos de farmacia'
          git push
