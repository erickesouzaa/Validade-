name: Adicionar produtos conhecidos

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Adicionar fallback para produtos não catalogados
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')

          codigo = '7897042016297'
          bloco = """    const produtosConhecidos = {
          '7897042016297': {
            nome: 'Loção Hidratante Corporal Skalinha Bebê Lavanda 200ml',
            marca: 'Skala',
            imagem: null
          }
        };

        const produtoConhecido = produtosConhecidos[codigo];
        if (produtoConhecido) return produtoConhecido;

"""

          padrao = r"(async function buscarProdutoAPI\(codigo\) \{\n)(?!\s*const produtosConhecidos)"
          novo_texto, alteracoes = re.subn(padrao, r"\1" + bloco, text, count=1)

          if alteracoes == 0:
              print('Fallback já instalado ou função não encontrada.')
          else:
              path.write_text(novo_texto, encoding='utf-8')

      - name: Salvar alteração no GitHub
        run: |
          if git diff --quiet; then
            echo "Nenhuma alteração necessária."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Corrige reconhecimento do EAN 7897042016297"
          git push
