name: Melhorar busca de produtos

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  melhorar-busca:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Atualizar função de busca
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')

          inicio = text.find('async function buscarProdutoAPI(codigo) {')
          if inicio == -1:
              raise SystemExit('Função buscarProdutoAPI não encontrada')

          fim = text.find('return null;\n}', inicio)
          if fim == -1:
              raise SystemExit('Fim da função buscarProdutoAPI não encontrado')
          fim += len('return null;\n}')

          nova_funcao = r'''async function buscarProdutoAPI(codigo) {
  const campos = 'product_name,product_name_pt,product_name_en,brands,image_front_small_url';

  // 1) API universal: procura automaticamente em Food, Beauty, Pet Food e Products.
  // O Open Food Facts documenta product_type=all para esse propósito.
  try {
    const url = `https://world.openfoodfacts.org/api/v3/product/${encodeURIComponent(codigo)}?product_type=all&fields=${campos}`;
    const res = await fetch(url, { redirect: 'follow' });
    if (res.ok) {
      const data = await res.json();
      if (data && data.product) {
        const p = data.product;
        const nome = p.product_name_pt || p.product_name || p.product_name_en;
        if (nome) {
          return {
            nome,
            marca: p.brands || '',
            imagem: p.image_front_small_url || null
          };
        }
      }
    }
  } catch (e) {}

  // 2) Fallback nas quatro bases diretamente.
  const fontes = [
    'https://world.openfoodfacts.org',
    'https://world.openbeautyfacts.org',
    'https://world.openpetfoodfacts.org',
    'https://world.openproductsfacts.org'
  ];

  for (const base of fontes) {
    try {
      const res = await fetch(`${base}/api/v2/product/${encodeURIComponent(codigo)}?fields=${campos}`);
      if (!res.ok) continue;
      const data = await res.json();
      if (data && data.status === 1 && data.product) {
        const p = data.product;
        const nome = p.product_name_pt || p.product_name || p.product_name_en;
        if (nome) {
          return {
            nome,
            marca: p.brands || '',
            imagem: p.image_front_small_url || null
          };
        }
      }
    } catch (e) {}
  }

  // 3) Cadastro local para códigos conhecidos que ainda não estejam nas bases públicas.
  const locais = {
    '7897042016297': {
      nome: 'Loção Hidratante Corporal Skalinha Bebê Lavanda 200 ml',
      marca: 'Skala',
      imagem: null
    }
  };

  return locais[codigo] || null;
}'''

          text = text[:inicio] + nova_funcao + text[fim:]
          path.write_text(text, encoding='utf-8')
      - name: Salvar alteração
        run: |
          if git diff --quiet -- index.html; then
            echo 'Nenhuma alteração necessária.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Amplia busca automática para diferentes tipos de produto'
          git push