name: Corrigir busca de produtos
on: push
permissions:
  contents: write
jobs:
  corrigir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Atualizar index
        run: |
          echo '
' | base64 -d > /tmp/patch.py
          python3 /tmp/patch.py
      - name: Salvar alteração
        run: |
          if git diff --quiet -- index.html; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Melhora busca automática e reconhece Skala'
          git push
