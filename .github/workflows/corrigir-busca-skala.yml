name: Corrigir busca de produtos

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  corrigir:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Atualizar busca de produtos
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')

          inicio = text.find('  async function buscarProdutoAPI(codigo) {')
          marcador_fim = '\n  function preencherFormulario(codigo, produto) {'
          fim = text.find(marcador_fim, inicio)

          if inicio == -1 or fim == -1:
              raise SystemExit('Não foi possível localizar a função buscarProdutoAPI no index.html')

          nova_funcao = '''  async function buscarProdutoAPI(codigo) {
    const campos = 'product_name,product_name_pt,product_name_en,brands,image_front_small_url';

    // API universal: procura em Food, Beauty, Pet Food e Products.
    try {
      const url = `https://world.openfoodfacts.org/api/v3/product/${encodeURIComponent(codigo)}?product_type=all&fields=${campos}`;
      const res = await fetch(url);
      if (res.ok) {
        const data = await res.json();
        if (data && data.product) {
          const p = data.product;
          const nome = p.product_name_pt || p.product_name || p.product_name_en;
          if (nome) {
            return {
              nome,
              marca: p.brands || '',
              imagem: p.image_front_small_url || null
            };
          }
        }
      }
    } catch (e) {}

    // Fallback direto nas quatro bases públicas.
    const fontes = [
      'https://world.openfoodfacts.org',
      'https://world.openbeautyfacts.org',
      'https://world.openpetfoodfacts.org',
      'https://world.openproductsfacts.org'
    ];

    for (const base of fontes) {
      try {
        const res = await fetch(`${base}/api/v2/product/${encodeURIComponent(codigo)}?fields=${campos}`);
        if (!res.ok) continue;
        const data = await res.json();
        if (data && data.status === 1 && data.product) {
          const p = data.product;
          const nome = p.product_name_pt || p.product_name || p.product_name_en;
          if (nome) {
            return {
              nome,
              marca: p.brands || '',
              imagem: p.image_front_small_url || null
            };
          }
        }
      } catch (e) {}
    }

    // Produtos conhecidos que ainda não estão catalogados nas bases públicas.
    const produtosConhecidos = {
      '7897042016297': {
        nome: 'Loção Hidratante Corporal Skalinha Bebê Lavanda 200 ml',
        marca: 'Skala',
        imagem: null
      }
    };

    return produtosConhecidos[codigo] || null;
  }'''

          path.write_text(text[:inicio] + nova_funcao + text[fim:], encoding='utf-8')
          PY

      - name: Salvar alteração
        run: |
          if git diff --quiet -- index.html; then
            echo 'Nenhuma alteração necessária.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Melhora busca automática e reconhece Skala'
          git push
