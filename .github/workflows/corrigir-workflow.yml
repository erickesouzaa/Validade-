name: Corrigir workflow

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  corrigir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Corrigir base64
        run: |
          python3 -c "from pathlib import Path; p=Path('.github/workflows/atualizar-busca-e-codigo.yml'); s=p.read_text(); s=s.replace('pLmJyYW5kfHxwL bWFyY2E','pLmJyYW5kfHxwLm1hcmNh'); p.write_text(s)"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/atualizar-busca-e-codigo.yml
          git diff --cached --quiet || (git commit -m 'Corrige base64 do patch' && git push)
